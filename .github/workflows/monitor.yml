name: receiver-monitor

on:
  # The real 20-minute cadence comes from cron-job.org calling the workflow_dispatch API
  # (GitHub's own scheduler only managed about one run every 4 hours). This hourly schedule is
  # just a fallback that keeps checks going if the external trigger or its token stops working.
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to run"
        type: choice
        default: check
        options: [check, dry-run, test-notify]

permissions:
  contents: write   # to commit state.json so alerts are never repeated

concurrency:
  group: receiver-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          MODE: ${{ inputs.mode || 'check' }}
        run: |
          case "$MODE" in
            test-notify) python monitor.py --test-notify ;;
            dry-run)     python monitor.py --dry-run ;;
            *)           python monitor.py ;;
          esac

      - name: Save state
        if: ${{ (inputs.mode || 'check') == 'check' }}
        run: |
          git config user.name  "receiver-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet; then echo "No state change"; exit 0; fi
          git commit -m "Update monitor state"
          git pull --rebase --quiet && git push
